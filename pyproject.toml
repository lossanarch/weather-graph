[project]
name = "ha-weather-graph"
version = "1.0.1"
description = "Home Assistant HACS integration and Lovelace card rendering an interactive 48-hour forecast graph powered by Bureau of Meteorology (BOM) or any HA weather entity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
